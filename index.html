<!DOCTYPE html>
<html lang="hu">
<head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Neon_Repo_V_2026 - VEGLEGES 20px - INDEX ALAPON - MUKODIK</title>
<style>
*{box-sizing:border-box}
html,body{height:100%;margin:0;background:#000;color:#0f0;font-family:Arial,Helvetica,sans-serif;overflow:hidden}
:root{--panel-w:640px}
.grid{display:grid;grid-template-columns:var(--panel-w) 1fr;height:100vh}
.proj-card{background:#1a1a1a;border:1px solid #333;border-radius:16px;padding:14px 16px;margin-bottom:12px}
.proj-card:hover{border-color:#0f0;box-shadow:0 0 12px #0f0}
.proj-card.active{border-color:#0f0;box-shadow:0 0 18px #0f0;background:#0a1a0a}
.topbar{background:#000;border-bottom:2px solid #0f0;padding:10px 16px;display:flex;gap:12px;align-items:center}
.kod{background:#001033;border:1px solid #00aaff;color:#00aaff;border-radius:999px;padding:8px 14px;font-size:13px;font-weight:400;cursor:pointer;font-family:Arial}
.kod:hover{background:#00aaff;color:#fff}
.htmlb{background:#001100;border:1px solid #0f0;color:#0f0;border-radius:999px;padding:8px 14px;font-size:13px;font-weight:400;cursor:pointer;font-family:Arial}
.htmlb:hover{background:#0f0;color:#000}
.delb{background:#330000;border:1px solid #f00;color:#f00;border-radius:999px;padding:8px 12px;font-size:13px;font-weight:400;cursor:pointer}
.panel{border:1px solid #0f0;border-radius:16px;padding:10px 14px;background:#0a0a0a;display:flex;align-items:center;gap:10px;margin-bottom:10px}
input[type=range]{flex:1;height:6px;background:#333;border-radius:999px}
.badge{background:#000;border:1px solid #0f0;color:#0f0;border-radius:999px;padding:2px 10px;font-size:10px;min-width:44px;text-align:center}
#previewFrame{width:100%;height:100%;border:2px solid #0f0;border-radius:8px;background:#fff}
.left{border-right:4px solid #0f0;background:#000;overflow:auto;display:flex;flex-direction:column}
.right{display:flex;flex-direction:column;background:#000;overflow:hidden}
#previewWrap{flex:1;background:#000;display:flex;padding:10px}
.btn{border:none;border-radius:10px;padding:10px;font-weight:700;cursor:pointer;font-family:Arial}
</style>
</head>
<body>
<div class="topbar">
<span style="color:#0047ff;font-weight:700;font-family:Arial">Neon_Repo_V_2026 - VEGLEGES</span>
<span style="background:#0047ff;color:#fff;border-radius:999px;padding:5px 14px;font-size:11px;font-family:Arial">F5 MEGMARAD • 20px Arial nem vastag • KÉK=MÁSOL ZÖLD=LETÖLT • INDEX JAVÍTVA</span>
<span style="margin-left:auto" id="cntBadge" class="badge">0 db</span>
</div>
<div class="grid">
<div class="left">
<div style="padding:12px">
<div class="panel"><span style="font-size:11px">PANEL</span><input id="panelSlider" type="range" min="280" max="900" value="640"><span id="panelBadge" class="badge">640px</span></div>
<div class="panel"><span style="font-size:11px">ZOOM</span><input id="previewSlider" type="range" min="30" max="200" value="100"><span id="previewBadge" class="badge">100%</span></div>
<div style="display:flex;gap:6px;flex-wrap:wrap;margin-top:10px">
<button onclick="downloadAllProjects()" class="btn" style="flex:1;background:#0047ff;color:#fff">⬇️ ÖSSZ 1 DB-BE</button>
<button onclick="document.getElementById('fileImportHtml').click()" class="btn" style="flex:1;background:#00ffaa;color:#000">📥 IMPORT HTML</button>
<button onclick="deleteAllProjects()" class="btn" style="background:#aa0000;color:#fff">🗑️ DEL</button>
</div>
<div style="display:flex;gap:6px;flex-wrap:wrap;margin-top:8px">
<button onclick="exportJsonModal()" class="btn" style="flex:1;background:#ffcc00;color:#000">📤 EXPORT JSON</button>
<button onclick="document.getElementById('fileImportJson').click()" class="btn" style="flex:1;background:#ccff00;color:#000">📥 IMPORT JSON</button>
</div>
<input type="file" id="fileImportHtml" accept=".html,.htm" style="display:none" multiple>
<input type="file" id="fileImportJson" accept=".json,.txt" style="display:none">
<div id="previewLabel" style="margin-top:10px;color:#0ff;font-size:11px;min-height:18px;font-family:Arial"></div>
<div id="list" style="margin-top:10px"></div>
<div id="status" style="margin-top:10px;color:#888;font-size:10px;white-space:pre-wrap;font-family:Arial"></div>
</div>
</div>
<div class="right"><div id="previewWrap"><iframe id="previewFrame" sandbox="allow-scripts allow-same-origin allow-forms allow-popups"></iframe></div></div>
</div>

<div id="exportModal" style="display:none;position:fixed;inset:0;z-index:9999;background:rgba(0,0,0,0.9);align-items:center;justify-content:center">
<div style="background:#0a0a0a;border:2px solid #00ffff;border-radius:16px;padding:22px;min-width:460px;max-width:90vw">
<div style="color:#00ffff;font-weight:700;font-size:15px;margin-bottom:14px;font-family:Arial">📤 EXPORT JSON</div>
<input id="exportNameInput" style="width:100%;background:#000;border:1px solid #00ffff;color:#0ff;border-radius:8px;padding:11px;font-family:Arial;font-size:13px">
<div id="exportInfo" style="color:#666;font-size:10px;margin-top:10px;white-space:pre-line;font-family:Arial"></div>
<div style="display:flex;gap:12px;margin-top:18px">
<button onclick="document.getElementById('exportModal').style.display='none'" class="btn" style="flex:1;background:#222;color:#aaa;border:1px solid #555">MÉGSE</button>
<button onclick="doExportJson()" class="btn" style="flex:1;background:#a020f0;color:#fff">EXPORT</button>
</div></div></div>

<script>
const DB_NAME='NeonRepo_Stable_v1';
const STORE='projects';
const KEY='all';
function openDB(){return new Promise((res,rej)=>{let r=indexedDB.open(DB_NAME,1);r.onupgradeneeded=e=>{let db=e.target.result;if(!db.objectStoreNames.contains(STORE))db.createObjectStore(STORE);};r.onsuccess=e=>res(e.target.result);r.onerror=()=>rej();});}
async function loadIDB(){try{let db=await openDB();return new Promise(r=>{let tx=db.transaction(STORE,'readonly');let st=tx.objectStore(STORE);let g=st.get(KEY);g.onsuccess=()=>{let v=g.result;db.close();r(Array.isArray(v)&&v.length>0?v:null);};g.onerror=()=>{db.close();r(null);};});}catch(e){return null;}}
async function saveIDB(){try{let db=await openDB();return new Promise(r=>{let tx=db.transaction(STORE,'readwrite');let st=tx.objectStore(STORE);st.put(PROJECTS,KEY);tx.oncomplete=()=>{db.close();r(true);};tx.onerror=()=>{db.close();r(false);};});}catch(e){return false;}}
async function saveAll(){let ok=await saveIDB();document.getElementById('cntBadge').textContent=PROJECTS.length+' db';}

let PROJECTS=[]; let curIndex=-1;

// INDEX ALAPÚ - NEM ID - EZ NEM TUD ELROMLANI
window.copyCode=function(idx){
  console.log('copyCode idx',idx);
  if(idx<0 || idx>=PROJECTS.length){alert('Nem található! idx:'+idx);return;}
  let pr=PROJECTS[idx];
  let code=pr.code;
  if(navigator.clipboard && navigator.clipboard.writeText){
    navigator.clipboard.writeText(code).then(()=>{
      document.getElementById('status').textContent='✅ KÉK KÓD másolva: '+pr.name+' • '+code.length+' char • Ctrl+V';
      document.getElementById('previewLabel').textContent=pr.name+' kódja vágólapra másolva ✓';
      // nem alert hanem status, hogy ne blokkoljon
      let el=document.getElementById('status'); el.style.color='#0f0'; setTimeout(()=>el.style.color='#888',2000);
    }).catch(()=>fallbackCopy(code,pr.name));
  }else fallbackCopy(code,pr.name);
};

function fallbackCopy(text,name){
  let ta=document.createElement('textarea'); ta.value=text; ta.style.position='fixed'; ta.style.left='-9999px'; document.body.appendChild(ta); ta.select();
  try{document.execCommand('copy'); document.getElementById('status').textContent='✅ KÓD másolva (fallback): '+name;}catch(e){prompt('Másold kézzel Ctrl+C:',text.substring(0,2000));}
  ta.remove();
}

window.downloadHtml=function(idx){
  console.log('downloadHtml idx',idx);
  if(idx<0 || idx>=PROJECTS.length){alert('Nem található!');return;}
  let pr=PROJECTS[idx];
  let blob=new Blob([pr.code],{type:'text/html'});
  let url=URL.createObjectURL(blob);
  let a=document.createElement('a'); a.href=url; a.download=pr.name.endsWith('.html')?pr.name:pr.name+'.html';
  document.body.appendChild(a); a.click(); a.remove();
  setTimeout(()=>URL.revokeObjectURL(url),1000);
  document.getElementById('status').textContent='✅ ZÖLD I HTML letöltve: '+pr.name;
};

window.deleteProject=function(idx){
  if(idx<0 || idx>=PROJECTS.length) return;
  let pr=PROJECTS[idx];
  if(!confirm('Törlöd: '+pr.name+'?')) return;
  PROJECTS.splice(idx,1);
  PROJECTS.forEach((x,j)=>x.sorszam=j+1);
  if(curIndex===idx){curIndex=-1; let f=document.getElementById('previewFrame'); f.removeAttribute('srcdoc'); f.src='about:blank';}
  else if(curIndex>idx) curIndex--;
  render(); saveAll();
};

window.previewProject=function(idx){
  if(idx<0 || idx>=PROJECTS.length) return;
  let pr=PROJECTS[idx];
  curIndex=idx;
  let f=document.getElementById('previewFrame');
  try{ f.removeAttribute('src'); f.srcdoc=pr.code; }
  catch(e){ let blob=new Blob([pr.code],{type:'text/html'}); let url=URL.createObjectURL(blob); f.src=url; }
  document.getElementById('previewLabel').textContent=(idx+1)+'_ '+pr.name+' - előnézet ✓';
  render();
};

function render(){
  let el=document.getElementById('list'); el.innerHTML='';
  PROJECTS.forEach((p,idx)=>{
    let active = (curIndex===idx)?' active':'';
    let d=document.createElement('div');
    d.className='proj-card'+active;
    // FONT: 20px NEM VASTAG ARIAL
    d.innerHTML=
      '<div style="display:flex;align-items:center;gap:12px">'+
        '<div style="width:12px;height:12px;border-radius:50%;background:'+p.color+';flex-shrink:0"></div>'+
        '<div onclick="previewProject('+idx+')" style="flex:1;color:'+p.color+';font-weight:400;font-size:20px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;font-family:Arial;cursor:pointer" title="'+p.name+'">'+(p.sorszam||idx+1)+'_ '+p.name+'</div>'+
        '<button class="kod" onclick="copyCode('+idx+')">KÓD</button>'+
        '<button class="htmlb" onclick="downloadHtml('+idx+')">I HTML</button>'+
        '<button class="delb" onclick="deleteProject('+idx+')">🗑️</button>'+
      '</div>'+
      '<div style="font-size:10px;color:#666;margin-top:4px;text-align:right;font-family:Arial">'+(p.size||(p.code.length/1024).toFixed(1)+' kB')+'</div>';
    el.appendChild(d);
  });
  document.getElementById('cntBadge').textContent=PROJECTS.length+' db';
}

window.downloadAllProjects=function(){
 let html=document.documentElement.outerHTML;
 try{let s=html.indexOf('let PROJECTS=');if(s!==-1){let b=html.indexOf('[',s);let depth=0,inS=null,esc=false,en=-1;for(let i=b;i<html.length;i++){let c=html[i];if(esc){esc=false;continue;}if(c=='\\'){esc=true;continue;}if(inS){if(c===inS)inS=null;continue;}if(c=='"'||c=="'"||c=='`'){inS=c;continue;}if(c=='[')depth++;else if(c==']'){depth--;if(depth===0){en=i;break;}}}if(en!==-1)html=html.slice(0,b)+JSON.stringify(PROJECTS)+html.slice(en+1);}}catch(e){}
 let blob=new Blob([html],{type:'text/html'});let url=URL.createObjectURL(blob);let a=document.createElement('a');a.href=url;a.download='Neon_Repo_'+PROJECTS.length+'db_'+new Date().toISOString().slice(0,10)+'.html';document.body.appendChild(a);a.click();a.remove();setTimeout(()=>URL.revokeObjectURL(url),1000);
};
window.deleteAllProjects=async function(){if(!confirm('Törlöd az összeset?'))return;PROJECTS=[];curIndex=-1;let f=document.getElementById('previewFrame');f.removeAttribute('srcdoc');f.src='about:blank';render();await saveAll();try{indexedDB.deleteDatabase(DB_NAME);}catch(e){}};

document.getElementById('fileImportHtml').addEventListener('change',async e=>{
 let files=Array.from(e.target.files); if(!files.length) return;
 for(let file of files){let txt=await file.text(); PROJECTS.push({sorszam:PROJECTS.length+1,name:file.name,color:'#00aaff',size:(txt.length/1024).toFixed(1)+' kB',code:txt});}
 e.target.value=''; render(); await saveAll();
});

window.exportJsonModal=function(){
 if(PROJECTS.length===0){alert('Nincs mit exportálni!');return;}
 let d=new Date(); let def='Html_adatbázis_Export_'+d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0')+'_'+String(d.getHours()).padStart(2,'0')+'-'+String(d.getMinutes()).padStart(2,'0')+'-'+String(d.getSeconds()).padStart(2,'0');
 document.getElementById('exportNameInput').value=def;
 document.getElementById('exportInfo').textContent='Fájl: '+def+'.json\nTartalom: '+PROJECTS.length+' projekt';
 document.getElementById('exportModal').style.display='flex';
};
window.doExportJson=function(){
 let fn=document.getElementById('exportNameInput').value.trim(); if(!fn) fn='Html_adatbázis_Export_'+new Date().toISOString().slice(0,10); if(!fn.toLowerCase().endsWith('.json')) fn+='.json';
 let blob=new Blob([JSON.stringify(PROJECTS,null,2)],{type:'application/json'}); let url=URL.createObjectURL(blob);
 let a=document.createElement('a');a.href=url;a.download=fn;document.body.appendChild(a);a.click();a.remove(); setTimeout(()=>URL.revokeObjectURL(url),800);
 document.getElementById('exportModal').style.display='none';
 document.getElementById('status').textContent='✅ JSON exportálva: '+fn;
};
document.getElementById('exportModal').addEventListener('click',function(e){if(e.target===this)this.style.display='none';});
document.getElementById('fileImportJson').addEventListener('change',async e=>{
 let file=e.target.files[0]; if(!file) return;
 try{
  let txt=await file.text(); let data=JSON.parse(txt); let arr=Array.isArray(data)?data:(data.projects||[]);
  if(arr.length===0 && typeof data==='object'){ for(let k in data){ if(typeof data[k]==='string') arr.push({name:k,code:data[k]}); } }
  arr.forEach(p=>{let code=p.code||p.content||''; if(code.length<5) return; PROJECTS.push({sorszam:PROJECTS.length+1,name:p.name||'file.html',color:p.color||'#00aaff',size:(code.length/1024).toFixed(1)+' kB',code:code});});
  render(); await saveAll(); alert(arr.length+' db JSON importálva');
 }catch(err){alert('JSON hiba:'+err.message);}
 e.target.value='';
});

document.getElementById('panelSlider').addEventListener('input',e=>{document.documentElement.style.setProperty('--panel-w',e.target.value+'px');document.getElementById('panelBadge').textContent=e.target.value+'px';});
document.getElementById('previewSlider').addEventListener('input',e=>{document.getElementById('previewBadge').textContent=e.target.value+'%';document.getElementById('previewFrame').style.zoom=e.target.value+'%';});

(async()=>{
 document.getElementById('status').textContent='Betöltés...';
 let data=await loadIDB();
 if(data&&data.length>0){PROJECTS=data; PROJECTS.forEach((x,j)=>{if(!x.sorszam)x.sorszam=j+1; if(!x.color)x.color='#00aaff';}); curIndex=0; render(); let f=document.getElementById('previewFrame'); try{f.srcdoc=PROJECTS[0].code;}catch(e){} document.getElementById('previewLabel').textContent=PROJECTS[0].name+' - előnézet ✓'; document.getElementById('status').textContent='✅ Visszaállítva: '+PROJECTS.length+' db';}
 else{PROJECTS=[{sorszam:1,name:"DEMO.html",color:"#00ff00",size:"0.5 kB",code:"<!DOCTYPE html><html><body style='background:#000;color:#0f0;padding:40px;font-family:Arial'><h1>DEMO</h1><p>Előnézet működik - katt a listára</p></body></html>"}]; curIndex=0; render(); document.getElementById('previewFrame').srcdoc=PROJECTS[0].code; await saveAll();}
})();
</script>
</body>
</html>
