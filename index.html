<!DOCTYPE html><html><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>100in1-V12-MULTI-DB-FIXED</title><style>
*{box-sizing:border-box}body{margin:0;background:#050505;color:#fff;font-family:Segoe UI,sans-serif;overflow:hidden;display:flex;flex-direction:column;height:100vh}
.topbar{height:96px;background:#0a0a0a;border-bottom:3px solid #222;display:flex;align-items:center;gap:10px;padding:8px 14px;overflow-x:auto;overflow-y:hidden;white-space:nowrap;flex-shrink:0}
.topbar::-webkit-scrollbar{height:13px} .topbar::-webkit-scrollbar-track{background:#111; border-radius:10px} .topbar::-webkit-scrollbar-thumb{background:#00ffff; border-radius:10px; border:1.5px solid #00ffff; box-shadow:0 0 8px #00ffffaa} .topbar::-webkit-scrollbar-thumb:hover{background:#00ff88; box-shadow:0 0 10px #00ffff}
.topbar button{padding:14px 22px;border-radius:12px;border:2px solid #333;color:#fff;font-weight:900;cursor:pointer;font-size:15px;white-space:nowrap;flex-shrink:0;transition:0.2s}
.topbar button.menu-btn{background:#1a1a1a !important; color:#ddd !important;}
.topbar button.menu-btn.active{background:#00ff00!important;color:#000!important;border-color:#00ff00!important;box-shadow:0 0 20px #00ff00!important;transform:scale(1.08);}
.logo{font-weight:900;color:#00ff00;margin-right:14px;font-size:17px;white-space:nowrap;text-shadow:0 0 10px #00ff00;flex-shrink:0}
.cyan-cnt{background:#001a1a;border:2px solid #00ffff;border-radius:12px;padding:6px 14px;font-size:20px;font-weight:900;margin-right:10px;min-width:46px;display:inline-block;text-align:center; box-shadow:0 0 10px #00ffff66;}
.main-wrap{flex:1;display:flex;overflow:hidden;min-height:0}
.sidebar{width:380px;background:#0a0a0a;border-right:2px solid #222;display:flex;flex-direction:column;padding:14px;overflow:hidden}
.main{flex:1;display:flex;flex-direction:column;background:#000;overflow:hidden}
h2{color:#00ff00;text-shadow:0 0 10px #00ff00, 0 0 20px #00ff00aa;font-size:16px;margin:0 0 8px 0;text-align:center; border:2px solid #00ff00; border-radius:8px; padding:6px; background:#001100; box-shadow:0 0 12px #00ff00aa;}
.storage{font-size:11px;color:#ffea00;font-weight:bold;margin-bottom:4px}
.bar{width:100%;height:8px;background:#111;border-radius:5px;overflow:hidden;margin-bottom:8px;border:1px solid #333}
#fill{height:100%;width:0%;background:linear-gradient(90deg,#ffea00,#fff);box-shadow:0 0 6px #ffea00;transition:0.5s}
input,textarea,button{background:#161616;color:#fff;border:1px solid #333;padding:10px;border-radius:8px;outline:none;margin-bottom:6px;font-size:13px}
input#fileName{border:3px solid #00ffff !important; box-shadow:0 0 10px #00ffff44; background:#0a1a1a !important;}
input#fileName:focus{border-color:#00ff88 !important; box-shadow:0 0 15px #00ffffaa;}
textarea{flex:1;width:100%;resize:none;font-family:Consolas,monospace;color:#0f0;font-size:13px;background:#000;border:1px solid #0f04;line-height:1.5}
.toolbar{display:flex;gap:6px;margin-bottom:6px}
button{cursor:pointer;font-weight:bold;font-size:11px;flex:1;border:1px solid transparent;transition:0.1s;text-transform:uppercase;padding:11px;border-radius:8px}
button:hover{filter:brightness(1.3)}
.btn-save{background:#ffea00;color:#000;box-shadow:0 0 10px #ffea00aa}
.btn-new{background:#222;color:#fff;border:1px solid #444}
.btn-del{background:#aa0000;border:1px solid #ff4444;color:#fff}
.btn-imp{background:#ff8800;border:1px solid #ffaa00;color:#000}
.btn-exp{background:#8800ff;border:1px solid #aa00ff;color:#fff}
.btn-edge{
  background:linear-gradient(180deg,#ff0000,#cc0000) !important;
  border:2px solid #ff3333 !important;
  color:#fff !important;
  font-weight:900 !important;
  font-size:13px !important;
  box-shadow:0 0 15px #ff0000aa, 0 0 30px #ff000055, inset 0 0 10px #ffffff33 !important;
  text-shadow:0 0 8px #fff, 0 0 15px #ff0000 !important;
  animation: pulseRed 1.2s infinite alternate !important;
}
@keyframes pulseRed{
  0%{box-shadow:0 0 10px #ff0000aa, 0 0 20px #ff000055; transform:scale(1);}
  100%{box-shadow:0 0 20px #ff0000ff, 0 0 40px #ff0000aa, 0 0 60px #ff000066; transform:scale(1.02);}
}
.btn-edge:hover{
  background:linear-gradient(180deg,#ff2222,#ff0000) !important;
  box-shadow:0 0 25px #ff0000ff, 0 0 50px #ff0000aa !important;
  filter:brightness(1.2) !important;
}

.btn-reset{background:#660000 !important;border:1px solid #ff0000 !important;color:#fff !important;}
#fileList{flex:1;overflow-y:auto;padding-right:4px;margin-top:8px}
.file-item{padding:10px;margin-bottom:8px;background:#141414;border-radius:8px;cursor:pointer;border:1px solid #222;border-left:5px solid #ffea00}
.file-item.active{background:#222;border-color:#ffea00aa}
.file-item strong{display:block;font-size:13px;margin-bottom:3px}
.file-item small{color:#888;font-size:10px;font-family:monospace}
.editor-sec{display:flex;flex-direction:column;padding:8px;border-bottom:2px solid #333;background:#000;overflow:hidden;height:45%;min-height:80px}
#resizer{height:12px;background:#1a1a1a;cursor:row-resize;display:flex;align-items:center;justify-content:center;border-top:2px solid #333;border-bottom:2px solid #333;flex-shrink:0}
#resizer:hover{background:#333}
#resizer::after{content:"═══ HÚZD AZ ÁTMÉRETEZÉSHEZ ═══"; color:#666; font-size:9px; letter-spacing:1px}
.preview-sec{flex:1;display:flex;flex-direction:column;background:#fff;overflow:hidden;min-height:80px}
.preview-head{background:#0a0a0a;color:#0f0;padding:6px 12px;font-size:11px;font-weight:bold;border-bottom:1px solid #333;display:flex;justify-content:space-between}
iframe.preview{flex:1;border:none;background:#fff;width:100%}
.bottom-block{margin-top:auto;display:flex;flex-direction:column;gap:6px;padding-top:8px;border-top:1px solid #222}

.btn-exp-all{background:#00cc00 !important;border:2px solid #00ff00 !important;color:#000 !important;box-shadow:0 0 12px #00ff00aa;font-size:13px !important;}
.btn-imp-all{background:#00cccc !important;border:3px solid #00ffff !important;color:#000 !important;box-shadow:0 0 12px #00ffffaa;font-size:13px !important;}

.editor-sec .toolbar button:hover{filter:brightness(1.25); transform:translateY(-1px);}

.menu-btn.has-data{
  /* Szélei maradnak eredeti változó színek - nem írjuk felül border-color-t */
  background:#1a1a1a !important;
  box-shadow:0 0 12px #ffffff22 !important;
  transform:scale(1.04);
}
.menu-btn.has-data .cyan-cnt{
  /* Csak a belseje bordó, mint a képen 28 */
  background:#4a0000 !important;
  border:2px solid #880000 !important;
  color:#fff !important;
  font-size:24px !important;
  font-weight:900 !important;
  min-width:60px !important;
  padding:8px 18px !important;
  box-shadow:0 0 15px #880000aa inset, 0 0 10px #ff000055 !important;
  text-shadow:0 0 8px #fff !important;
}
/* Repo név fehér és nagyobb, mint a képen 1. REPO 1 */
.menu-btn.has-data{
  color:#fff !important;
  font-size:17px !important;
  font-weight:900 !important;
  text-shadow:0 0 8px #ffffffaa !important;
}
</style></head><body>
<div class="topbar" id="topbar"><div class="logo">100in1-V12</div></div>
<div class="main-wrap">
<div class="sidebar">
<h2 id="titleH2">⚡ 1. REPO 1 V12</h2>
<div class="storage">TÁRHELY: <span id="stTxt">0 MB</span> | <span id="status" style="color:#0f0">INIT</span> | <span id="dbNameLabel" style="color:#888">DB1</span></div><div class="bar"><div id="fill"></div></div>
<input type="text" id="fileName" placeholder="Projekt neve...">
<div id="fileList"></div>
<div class="bottom-block">
<div class="toolbar"><button class="btn-save" onclick="saveToDB()">MENTÉS + JSON</button><button class="btn-new" onclick="newProj()">ÚJ</button><button class="btn-del" onclick="deleteFromDB()">TÖRÖL</button></div>
<div class="toolbar"><button class="btn-imp" onclick="importData()">IMPORT</button><button class="btn-exp" onclick="exportData()">EXPORT</button></div>
<div class="toolbar"><button class="btn-edge" onclick="resetAll100()">💥 RESET 100</button><button class="btn-reset" onclick="clearAll()">RENDSZER RESET</button></div>
<div class="toolbar" style="border-top:2px solid #00ff00; padding-top:6px; margin-top:4px;"><button class="btn-exp-all" onclick="exportAll100()">💾 EXPORT MIND A 100</button><button class="btn-imp-all" onclick="importAll100()">📥 IMPORT MIND A 100</button></div>
</div>
</div>
<div class="main">
<div class="editor-sec" id="editorSec"><div class="toolbar" style="align-items:center; gap:8px;"><span style="color:#ffff00;font-size:12px;font-weight:900; padding:6px 10px; background:#222; border-radius:6px; border:1px solid #444;">KÓD</span><div style="flex:1"></div><button style="background:#0066ff; color:#fff; border:1px solid #0088ff; padding:10px 18px; font-size:12px; flex:0 0 auto; min-width:110px; border-radius:8px;" onclick="copyCode()">📋 MÁSOLÁS</button><button style="background:#00cc00; color:#000; border:1px solid #00ff00; padding:10px 20px; font-size:12px; font-weight:900; flex:0 0 auto; min-width:140px; border-radius:8px; box-shadow:0 0 8px #00ff0055;" onclick="runCode()">▶ FUTTATÁS</button></div>
<textarea id="editor" spellcheck="false" placeholder="Ide írd a HTML kódot..."></textarea></div>
<div id="resizer"></div>
<div class="preview-sec" id="previewSec"><div class="preview-head"><span>ELŐNÉZET - HÚZD FELÜL!</span><span>↕</span></div><iframe id="preview" class="preview"></iframe></div>
</div>
</div>
<script>
let db=null; let activeId=null;
  setTimeout(()=>{updateTitleWithTotal();}, 300); let useLS=false; let currentDB=1;
const STORE="projects";
const neonColors=['#00f6ff', '#ffaa00', '#ff00ff', '#ffff00', '#00ff88', '#ff4400', '#00ff00', '#ff00aa', '#00aaff', '#aaff00', '#ff6600', '#66ff00', '#ff0066', '#0066ff', '#ff8800', '#88ff00'];
let DB_NAME="NeonRepoV5_1";
let LS_KEY="NeonRepoV5_LS_1";

function setStatus(t,c){try{document.getElementById('status').textContent=t; document.getElementById('status').style.color=c||"#0f0";}catch(e){} console.log(t);}

function getLS(){try{return JSON.parse(localStorage.getItem(LS_KEY)||"[]");}catch(e){return [];}}
function setLS(arr){try{localStorage.setItem(LS_KEY, JSON.stringify(arr));}catch(e){alert("localStorage tele!");}}

function updateCnt(id, count){
  try{
    const el=document.getElementById('cnt'+(id-1));
    const btn=document.getElementById('btn'+(id-1));
    if(el){
      el.textContent=count;
      if(count>0){
        el.style.display='inline-block';
        if(btn){
          btn.classList.add('has-data');
          // Make repo text white bigger as in image
          btn.style.color='#fff';
        }
      }else{
        if(btn){
          btn.classList.remove('has-data');
          btn.style.color='';
        }
      }
    }
  }catch(e){}
}


let totalAllCount=0;
function updateAllCounts(){
  totalAllCount=0;
  let processed=0;
  for(let i=1;i<=100;i++){
    const lsKey="NeonRepoV5_LS_"+i;
    try{
      const arr=JSON.parse(localStorage.getItem(lsKey)||"[]");
      if(arr.length>0){
        updateCnt(i, arr.length);
        totalAllCount+=arr.length;
        processed++;
        if(processed>=100) updateTitleWithTotal();
        continue;
      }
    }catch(e){}
    (function(repoId){
      try{
        const req=indexedDB.open("NeonRepoV5_"+repoId,1);
        req.onsuccess=e=>{
          try{
            const d=e.target.result;
            if(!d.objectStoreNames.contains("projects")){
              processed++;
              if(processed>=100) updateTitleWithTotal();
              d.close(); return;
            }
            const tx=d.transaction("projects","readonly");
            tx.objectStore("projects").getAll().onsuccess=ev=>{
              const cnt=ev.target.result.length;
              if(cnt>0){
                updateCnt(repoId, cnt);
                totalAllCount+=cnt;
              }
              processed++;
              if(processed>=100) updateTitleWithTotal();
              d.close();
            };
            tx.objectStore("projects").getAll().onerror=()=>{
              processed++;
              if(processed>=100) updateTitleWithTotal();
              try{d.close();}catch(ex){}
            };
          }catch(ex){
            processed++;
            if(processed>=100) updateTitleWithTotal();
          }
        };
        req.onerror=()=>{
          processed++;
          if(processed>=100) updateTitleWithTotal();
        };
      }catch(ex){
        processed++;
        if(processed>=100) updateTitleWithTotal();
      }
    })(i);
  }
  setTimeout(()=>{updateTitleWithTotal();}, 1200);
}

function updateTitleWithTotal(){
  try{
    const h2=document.getElementById('titleH2');
    if(h2){
      // Keep current repo number but add total in green
      const repoNum=currentDB;
      h2.innerHTML='⚡ '+repoNum+'. REPO '+repoNum+' V12 <span style="color:#00ff00; font-size:12px; margin-left:8px; border-left:2px solid #00ff00; padding-left:8px;">💾 ÖSSZ: '+totalAllCount+' db</span>';
      h2.style.color='#00ff00';
    }
  }catch(e){}
}



function initDB(){
  setStatus("DB nyitás...","#ff0");
  if(db){try{db.close();}catch(e){} db=null;}
  if(useLS){loadList(); return;}
  try{
    if(!window.indexedDB) throw new Error("No IDB");
    const req=indexedDB.open(DB_NAME,1);
    req.onupgradeneeded=e=>{const d=e.target.result; if(!d.objectStoreNames.contains(STORE)) d.createObjectStore(STORE,{keyPath:"id",autoIncrement:true});};
    req.onsuccess=e=>{db=e.target.result; setStatus("DB: IndexedDB OK - "+DB_NAME,"#0f0"); loadList();};
    req.onerror=e=>{console.warn("IDB error",e); setStatus("DB: LS fallback","#ff8800"); useLS=true; loadList();};
    req.onblocked=()=>{setStatus("DB: blokkolva LS","#ff8800"); useLS=true; loadList();};
  }catch(err){
    setStatus("DB: localStorage","#ff8800"); useLS=true; loadList();
  }
}

function switchDB(id){
  currentDB=id;
  DB_NAME="NeonRepoV5_"+id;
  LS_KEY="NeonRepoV5_LS_"+id;
  const col=neonColors[(id-1) % neonColors.length];
  document.getElementById('titleH2').textContent="⚡ "+id+". REPO "+id+" V12";
  document.getElementById('titleH2').style.color='#00ff00';
  document.getElementById('titleH2').style.textShadow="0 0 10px #00ff00, 0 0 20px #00ff00aa";
  document.getElementById('dbNameLabel').textContent=DB_NAME;
  document.querySelectorAll('.menu-btn').forEach(b=>b.classList.remove('active'));
  const activeBtn=document.getElementById('btn'+(id-1));
  if(activeBtn) activeBtn.classList.add('active');
  activeId=null;
  setTimeout(()=>{updateTitleWithTotal();}, 300);
  document.getElementById('fileName').value="";
  document.getElementById('editor').value="";
  document.getElementById('preview').src="about:blank";
  // update color
  document.documentElement.style.setProperty('--main-color', col);
  // reload DB
  initDB();
}

function downloadFile(content,fileName){
  try{
    const blob=new Blob([content],{type:"application/json"});
    const url=URL.createObjectURL(blob);
    const a=document.createElement("a");
    a.href=url; a.download=fileName;
    document.body.appendChild(a);
    a.click();
    setTimeout(()=>{document.body.removeChild(a); URL.revokeObjectURL(url);},800);
  }catch(e){alert("Letöltés hiba: "+e.message);}
}

function saveToDB(){
  const nameEl=document.getElementById("fileName");
  const codeEl=document.getElementById("editor");
  const name=(nameEl.value.trim() || "Repo"+currentDB+"_"+Date.now());
  const code=codeEl.value;
  if(!code.trim()){alert("Üres a kód!"); return;}
  const color=neonColors[(currentDB-1) % neonColors.length];
  const obj={name,code,color,time:new Date().toLocaleString("hu-HU")};
  if(activeId) obj.id=activeId;

  if(useLS){
    let arr=getLS();
    if(activeId){
      const idx=arr.findIndex(x=>x.id===activeId);
      if(idx>=0) arr[idx]=obj; else {obj.id=Date.now(); arr.push(obj); activeId=obj.id;}
    }else{obj.id=Date.now(); arr.push(obj); activeId=obj.id;}
    setLS(arr);
    loadList();
    const now=new Date(); const pad=n=>String(n).padStart(2,'0');
    const d=now.getFullYear()+"-"+pad(now.getMonth()+1)+"-"+pad(now.getDate());
    const t=pad(now.getHours())+"-"+pad(now.getMinutes())+"-"+pad(now.getSeconds());
    const fname=currentDB+"_"+name.replace(/\s+/g,'_')+"_"+d+"_"+t+".json";
    downloadFile(JSON.stringify(obj,null,2), fname);
    setStatus("MENTVE LS: "+name,"#0f0");
    return;
  }

  if(!db){alert("DB még nem nyílt"); return;}
  try{
    const tx=db.transaction(STORE,"readwrite");
    const store=tx.objectStore(STORE);
    const req=store.put(obj);
    req.onsuccess=e=>{
      activeId=activeId||e.target.result;
      loadList();
      const now=new Date(); const pad=n=>String(n).padStart(2,'0');
      const d=now.getFullYear()+"-"+pad(now.getMonth()+1)+"-"+pad(now.getDate());
      const t=pad(now.getHours())+"-"+pad(now.getMinutes())+"-"+pad(now.getSeconds());
      const fname=currentDB+"_"+name.replace(/\s+/g,'_')+"_"+d+"_"+t+".json";
      downloadFile(JSON.stringify(obj,null,2), fname);
      setStatus("MENTVE: "+name,"#0f0");
    };
  }catch(e){useLS=true; saveToDB();}
}

function loadList(){
  const render=(items)=>{
    const list=document.getElementById("fileList");
    if(!list) return;
    list.innerHTML="";
    let size=0;
    items.forEach(item=>{
      try{size+=new Blob([item.code||""]).size;}catch(e){}
      const div=document.createElement("div");
      div.className="file-item"+(activeId===item.id?" active":"");
      div.style.borderLeftColor=item.color||neonColors[(currentDB-1)%neonColors.length];
      div.innerHTML="<strong style='color:"+(item.color||"#ffea00")+"'>"+(item.name||"Névtelen")+"</strong><small>"+(item.time||"")+"</small>";
      div.onclick=()=>{
        activeId=item.id;
        document.getElementById("fileName").value=item.name;
        document.getElementById("editor").value=item.code;
        loadList();
        runCode();
      };
      list.appendChild(div);
    });
    const mb=(size/(1024*1024)).toFixed(2);
    const st=document.getElementById("stTxt");
    if(st) st.textContent=mb+" MB / 500 MB";
    updateCnt(currentDB, items.length);
    const fill=document.getElementById("fill");
    if(fill) fill.style.width=Math.min((size/(500*1024*1024))*100,100)+"%";
  };
  if(useLS){render(getLS()); return;}
  if(!db){setTimeout(loadList,500); return;}
  try{
    const tx=db.transaction(STORE,"readonly");
    tx.objectStore(STORE).getAll().onsuccess=e=>{render(e.target.result);};
  }catch(e){useLS=true; render(getLS());}
}

function runCode(){
  const code=document.getElementById("editor").value;
  if(!code.trim()){alert("Nincs kód!"); return;}
  try{
    const blob=new Blob([code],{type:'text/html'});
    const url=URL.createObjectURL(blob);
    const ifr=document.getElementById("preview");
    ifr.src=url;
    setTimeout(()=>URL.revokeObjectURL(url), 15000);
    setStatus("FUTTATVA","#0f0");
  }catch(e){alert("Futtatás hiba: "+e.message);}
}

function newProj(){
  activeId=null;
  setTimeout(()=>{updateTitleWithTotal();}, 300);
  document.getElementById("fileName").value="";
  document.getElementById("editor").value="";
  document.getElementById("preview").src="about:blank";
  loadList();
  setStatus("ÚJ projekt","#ff0");
}

function deleteFromDB(){
  if(!activeId){alert("Válassz ki egy projektet!"); return;}
  if(!confirm("Törlöd?")) return;
  if(useLS){
    let arr=getLS().filter(x=>x.id!==activeId);
    setLS(arr); newProj(); setStatus("TÖRÖLVE LS","#f00"); return;
  }
  try{
    const tx=db.transaction(STORE,"readwrite");
    tx.objectStore(STORE).delete(activeId).onsuccess=()=>{newProj(); setStatus("TÖRÖLVE","#f00");};
  }catch(e){useLS=true; deleteFromDB();}
}

function exportData(){
  const now=new Date(); const pad=n=>String(n).padStart(2,'0');
  const dateStr=now.getFullYear()+"-"+pad(now.getMonth()+1)+"-"+pad(now.getDate());
  const timeStr=pad(now.getHours())+":"+pad(now.getMinutes())+":"+pad(now.getSeconds());
  const timeFile=pad(now.getHours())+"-"+pad(now.getMinutes())+"-"+pad(now.getSeconds());
  const baseName=document.getElementById("fileName").value.trim()||("Repo"+currentDB+"_Export");
  const defName=currentDB+"_"+baseName.replace(/\s+/g,'_')+"_"+dateStr+"_"+timeFile;
  let name=prompt("Export fájl neve (név_dátum_idő):", defName);
  if(!name) return;
  if(!name.endsWith(".json")) name+=".json";

  const doExport=(data)=>{
    if(!data.length){alert("Nincs mentett adat!"); return;}
    const exportObj={
      exportName:name,
      exportDate:dateStr,
      exportTime:timeStr,
      exportDateTime:now.toLocaleString("hu-HU"),
      repo:currentDB,
      count:data.length,
      data:data
    };
    downloadFile(JSON.stringify(exportObj,null,2), name);
    setStatus("EXPORT: "+name,"#0f0");
  };

  if(useLS){doExport(getLS()); return;}
  try{
    const tx=db.transaction(STORE,"readonly");
    tx.objectStore(STORE).getAll().onsuccess=e=>{doExport(e.target.result);};
  }catch(e){doExport(getLS());}
}

function importData(){
  const input=document.createElement("input");
  input.type="file";
  input.accept=".json";
  input.onchange=e=>{
    const file=e.target.files[0];
    if(!file) return;
    const reader=new FileReader();
    reader.onload=ev=>{
      try{
        const parsed=JSON.parse(ev.target.result);
        let arr=parsed.data||parsed;
        if(!Array.isArray(arr)) arr=[arr];
        if(useLS){
          let cur=getLS();
          arr.forEach(it=>{delete it.id; it.id=Date.now()+Math.floor(Math.random()*10000); cur.push(it);});
          setLS(cur); loadList(); alert("Import kész LS: "+arr.length+" db"); return;
        }
        const tx=db.transaction(STORE,"readwrite");
        const store=tx.objectStore(STORE);
        arr.forEach(it=>{delete it.id; store.put(it);});
        tx.oncomplete=()=>{loadList(); alert("Import kész: "+arr.length+" db");};
      }catch(err){alert("Import hiba: "+err.message);}
    };
    reader.readAsText(file);
  };
  input.click();
}

function resetAll100(){
  if(!confirm("⚠️ BIZTOS TÖRLÖD MIND A 100 REPÓT?\n\nEz 100 adatbázist és az összes projektet törli!\nNEM VISSZAVONHATÓ!")){
    return;
  }
  if(!confirm("🔴 VÉGSŐ MEGERŐSÍTÉS\n\nTényleg törlöd MIND A 100 repót?\nMinden mentett kód elveszik!\n\nOK = TÖRLÉS")){
    return;
  }
  setStatus("RESET 100... törlés","#f00");
  let deletedLS=0;
  let deletedIDB=0;
  let total=0;

  // Delete LS
  for(let i=1;i<=100;i++){
    const key="NeonRepoV5_LS_"+i;
    if(localStorage.getItem(key)){
      localStorage.removeItem(key);
      deletedLS++;
    }
  }

  // Delete IDB databases
  let completed=0;
  const finish=()=>{
    completed++;
    if(completed>=100){
      total=deletedLS+deletedIDB;
      alert("💥 RESET 100 KÉSZ!\n\nTörölve:\n- LS: "+deletedLS+" repo\n- IDB: "+deletedIDB+" repo\n\nMind a 100 repo üres!");
      setStatus("RESET 100 KÉSZ: "+total+" törölve","#f00");
      // Reset current view
      activeId=null;
  setTimeout(()=>{updateTitleWithTotal();}, 300);
      document.getElementById("fileName").value="";
      document.getElementById("editor").value="";
      document.getElementById("preview").src="about:blank";
      loadList();
      updateAllCounts();
      // Also try to close current db
      try{if(db){db.close(); db=null;}}catch(e){}
      initDB();
    }
  };

  for(let i=1;i<=100;i++){
    try{
      const del=indexedDB.deleteDatabase("NeonRepoV5_"+i);
      del.onsuccess=()=>{deletedIDB++; finish();};
      del.onerror=()=>{finish();};
      del.onblocked=()=>{finish();};
    }catch(e){
      finish();
    }
  }
  // If IDB not supported, finish quickly
  setTimeout(()=>{
    if(completed<100){
      // Force finish after 3 sec
      while(completed<100){completed++; if(completed>=100) break;}
      // Call finish logic
      total=deletedLS+deletedIDB;
      if(total>0){
        setStatus("RESET 100 KÉSZ","#f00");
        loadList();
        updateAllCounts();
      }
    }
  },3000);
}

    tx.objectStore(STORE).clear().onsuccess=()=>{newProj(); setStatus("RESET kész","#f00");};

function exportAll100(){
  const now=new Date(); const pad=n=>String(n).padStart(2,'0');
  const dateStr=now.getFullYear()+"-"+pad(now.getMonth()+1)+"-"+pad(now.getDate());
  const timeFile=pad(now.getHours())+"-"+pad(now.getMinutes())+"-"+pad(now.getSeconds());
  const timeStr=pad(now.getHours())+":"+pad(now.getMinutes())+":"+pad(now.getSeconds());
  let defName="100in1_ALL_"+dateStr+"_"+timeFile;
  let name=prompt("Mind a 100 repo export neve:", defName);
  if(!name) return;
  if(!name.endsWith(".json")) name+=".json";

  setStatus("Exportálás mind a 100...","#ff0");
  const allRepos=[];
  let completed=0;

  const finish=()=>{
    completed++;
    if(completed>=100){
      const totalCount=allRepos.reduce((s,r)=>s+r.count,0);
      const exportObj={
        version:"V12-ALL-100",
        exportName:name,
        exportDate:dateStr,
        exportTime:timeStr,
        exportDateTime:now.toLocaleString("hu-HU"),
        totalRepos:100,
        totalCount:totalCount,
        repos:allRepos
      };
      downloadFile(JSON.stringify(exportObj,null,2), name);
      setStatus("EXPORT ALL 100 kész: "+totalCount+" db","#0f0");
      alert("Export kész! "+totalCount+" projekt 100 repóból\nFájl: "+name);
    }
  };

  for(let i=1;i<=100;i++){
    const lsKey="NeonRepoV5_LS_"+i;
    let lsData=[];
    try{lsData=JSON.parse(localStorage.getItem(lsKey)||"[]");}catch(e){lsData=[];}

    // Try IndexedDB
    try{
      const req=indexedDB.open("NeonRepoV5_"+i,1);
      req.onsuccess=e=>{
        try{
          const d=e.target.result;
          if(!d.objectStoreNames.contains("projects")){
            allRepos.push({repo:i, count:lsData.length, data:lsData});
            d.close();
            finish();
            return;
          }
          const tx=d.transaction("projects","readonly");
          const getAll=tx.objectStore("projects").getAll();
          getAll.onsuccess=ev=>{
            const idbData=ev.target.result||[];
            // Merge LS and IDB, deduplicate by id
            const merged=[...idbData];
            lsData.forEach(lsItem=>{
              if(!merged.find(m=>m.id===lsItem.id)) merged.push(lsItem);
            });
            allRepos.push({repo:i, count:merged.length, data:merged});
            d.close();
            finish();
          };
          getAll.onerror=()=>{
            allRepos.push({repo:i, count:lsData.length, data:lsData});
            try{d.close();}catch(ex){}
            finish();
          };
        }catch(ex){
          allRepos.push({repo:i, count:lsData.length, data:lsData});
          finish();
        }
      };
      req.onerror=()=>{
        allRepos.push({repo:i, count:lsData.length, data:lsData});
        finish();
      };
    }catch(ex){
      allRepos.push({repo:i, count:lsData.length, data:lsData});
      finish();
    }
  }
}

function importAll100(){
  const input=document.createElement("input");
  input.type="file";
  input.accept=".json";
  input.onchange=e=>{
    const file=e.target.files[0];
    if(!file) return;
    const reader=new FileReader();
    reader.onload=ev=>{
      try{
        const parsed=JSON.parse(ev.target.result);
        let repos=[];
        if(parsed.repos && Array.isArray(parsed.repos)){
          repos=parsed.repos;
        }else if(parsed.data && Array.isArray(parsed.data)){
          // Single repo export - import into current repo
          repos=[{repo:currentDB, data:parsed.data}];
        }else if(Array.isArray(parsed)){
          repos=[{repo:currentDB, data:parsed}];
        }else{
          alert("Ismeretlen formátum!");
          return;
        }

        if(!confirm("Importálod mind a 100 repót?\n"+repos.length+" repo, összesen "+repos.reduce((s,r)=>s+(r.data?r.data.length:0),0)+" projekt\nEz hozzáadja a meglévőkhöz, nem törli!")){
          return;
        }

        let imported=0;
        let totalImported=0;

        repos.forEach(r=>{
          const repoId=r.repo||currentDB;
          const dataArr=r.data||[];
          if(!dataArr.length) return;
          const lsKey="NeonRepoV5_LS_"+repoId;
          try{
            let cur=[];
            try{cur=JSON.parse(localStorage.getItem(lsKey)||"[]");}catch(e){cur=[];}
            dataArr.forEach(it=>{
              const newItem={...it};
              delete newItem.id;
              newItem.id=Date.now()+Math.floor(Math.random()*100000)+repoId;
              cur.push(newItem);
            });
            localStorage.setItem(lsKey, JSON.stringify(cur));
            totalImported+=dataArr.length;
          }catch(e){console.warn("LS import error repo "+repoId, e);}

          // Also try IDB
          try{
            const req=indexedDB.open("NeonRepoV5_"+repoId,1);
            req.onupgradeneeded=ev=>{
              const d=ev.target.result;
              if(!d.objectStoreNames.contains("projects")) d.createObjectStore("projects",{keyPath:"id",autoIncrement:true});
            };
            req.onsuccess=ev=>{
              try{
                const d=ev.target.result;
                const tx=d.transaction("projects","readwrite");
                const store=tx.objectStore("projects");
                dataArr.forEach(it=>{
                  const copy={...it};
                  delete copy.id;
                  store.put(copy);
                });
                tx.oncomplete=()=>{
                  d.close();
                  imported++;
                  if(imported>=repos.length){
                    alert("Import kész! "+totalImported+" projekt importálva "+repos.length+" repóba");
                    setStatus("IMPORT ALL 100 kész: "+totalImported,"#0f0");
                    loadList();
                    updateAllCounts();
                  }
                };
              }catch(ex){imported++; console.warn(ex);}
            };
            req.onerror=()=>{imported++;};
          }catch(ex){imported++;}
        });

        // If only LS
        if(repos.every(r=>true)){
          setTimeout(()=>{
            alert("Import kész (LS)! "+totalImported+" projekt");
            loadList();
            updateAllCounts();
          },500);
        }

      }catch(err){
        alert("Import hiba: "+err.message);
      }
    };
    reader.readAsText(file);
  };
  input.click();
}

// Resizer
(function(){
  const resizer=document.getElementById('resizer');
  const editorSec=document.getElementById('editorSec');
  if(!resizer || !editorSec) return;
  let dragging=false; let startY=0; let startH=0;
  resizer.addEventListener('mousedown', e=>{
    dragging=true; startY=e.clientY; startH=editorSec.offsetHeight;
    document.body.style.cursor='row-resize'; document.body.style.userSelect='none';
    e.preventDefault();
  });
  document.addEventListener('mousemove', e=>{
    if(!dragging) return;
    const dy=e.clientY - startY;
    let newH=startH + dy;
    const total=document.querySelector('.main').offsetHeight;
    if(newH < 80) newH=80;
    if(newH > total - 80) newH=total-80;
    editorSec.style.height=newH+'px';
    editorSec.style.flex='none';
  });
  document.addEventListener('mouseup', ()=>{
    if(dragging){dragging=false; document.body.style.cursor=''; document.body.style.userSelect='';}
  });
})();
